<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fresh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="60%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <radialGradient id="fresh-light" cx="0.15" cy="0.1" r="0.8">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="800" height="320" fill="url(#fresh-bg)"/>
  <rect width="800" height="320" fill="url(#fresh-light)"/>
  <!-- Decorative organic shapes -->
  <circle cx="670" cy="120" r="80" fill="#FBBF24" opacity="0.9"/>
  <circle cx="720" cy="180" r="55" fill="#F97316" opacity="0.85"/>
  <ellipse cx="620" cy="220" rx="70" ry="45" fill="#DC2626" opacity="0.9"/>
  <!-- Leaf accent -->
  <path d="M690 105 Q705 85 725 100 Q715 115 690 105" fill="#22C55E"/>
  <!-- Subtle glow -->
  <circle cx="670" cy="120" r="110" fill="#FBBF24" opacity="0.15" filter="url(#blur1)"/>
  <!-- Text -->
  <text x="60" y="130" font-family="'Inter',sans-serif" font-weight="900" font-size="52" fill="#fff" letter-spacing="-2">Frais &amp; local</text>
  <text x="60" y="180" font-family="'Inter',sans-serif" font-weight="900" font-size="52" fill="#FBBF24" letter-spacing="-2">livré en 2h</text>
  <text x="60" y="230" font-family="'Inter',sans-serif" font-weight="400" font-size="18" fill="#fff" opacity="0.9">Fruits &amp; légumes cueillis à Bouira</text>
  <!-- CTA pill -->
  <rect x="60" y="255" width="180" height="40" rx="20" fill="#fff"/>
  <text x="150" y="281" text-anchor="middle" font-family="'Inter',sans-serif" font-weight="700" font-size="14" fill="#15803D">Découvrir →</text>
</svg>
