<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="loy-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="60%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="loy-gift" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </radialGradient>
  </defs>
  <rect width="800" height="320" fill="url(#loy-bg)"/>
  <!-- Gift box illustration -->
  <g transform="translate(600,160)">
    <rect x="-70" y="-20" width="140" height="80" rx="6" fill="url(#loy-gift)"/>
    <rect x="-70" y="-20" width="140" height="16" fill="#F59E0B"/>
    <rect x="-8" y="-40" width="16" height="100" fill="#DC2626"/>
    <path d="M-8 -40 Q-30 -60 -8 -40 M8 -40 Q30 -60 8 -40" stroke="#DC2626" stroke-width="6" fill="#DC2626"/>
    <circle cx="-14" cy="-45" r="10" fill="#DC2626"/>
    <circle cx="14" cy="-45" r="10" fill="#DC2626"/>
    <circle cx="-14" cy="-45" r="4" fill="#FEF3C7"/>
    <circle cx="14" cy="-45" r="4" fill="#FEF3C7"/>
  </g>
  <!-- Coins -->
  <circle cx="500" cy="250" r="14" fill="#FCD34D" stroke="#D97706" stroke-width="2"/>
  <circle cx="525" cy="240" r="10" fill="#FCD34D" stroke="#D97706" stroke-width="2"/>
  <circle cx="480" cy="240" r="9" fill="#FCD34D" stroke="#D97706" stroke-width="2"/>
  <!-- Text -->
  <text x="60" y="110" font-family="'Inter',sans-serif" font-weight="800" font-size="14" fill="#FEF3C7" letter-spacing="5">PROGRAMME FIDÉLITÉ</text>
  <text x="60" y="165" font-family="'Inter',sans-serif" font-weight="900" font-size="46" fill="#fff" letter-spacing="-1.5">1 DA = 1 point</text>
  <text x="60" y="215" font-family="'Inter',sans-serif" font-weight="400" font-size="20" fill="#fff" opacity="0.95">Convertissez vos points en</text>
  <text x="60" y="240" font-family="'Inter',sans-serif" font-weight="800" font-size="24" fill="#FEF3C7">réductions sur vos prochaines courses.</text>
</svg>
