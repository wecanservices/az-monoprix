<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ram-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="60%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7A030A"/>
    </linearGradient>
    <radialGradient id="ram-moon" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="80%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <filter id="ram-glow"><feGaussianBlur stdDeviation="15"/></filter>
  </defs>
  <rect width="800" height="320" fill="url(#ram-bg)"/>
  <!-- Stars -->
  <g fill="#FEF3C7">
    <circle cx="150" cy="60" r="1.5"/>
    <circle cx="250" cy="40" r="2"/>
    <circle cx="380" cy="75" r="1.5"/>
    <circle cx="500" cy="50" r="2"/>
    <circle cx="200" cy="110" r="1"/>
    <circle cx="440" cy="100" r="1.5"/>
  </g>
  <!-- Moon (crescent) -->
  <g transform="translate(620,140)">
    <circle cx="0" cy="0" r="70" fill="url(#ram-moon)" opacity="0.4" filter="url(#ram-glow)"/>
    <circle cx="0" cy="0" r="55" fill="url(#ram-moon)"/>
    <circle cx="18" cy="-5" r="52" fill="url(#ram-bg)"/>
  </g>
  <!-- Lanterns silhouette -->
  <g transform="translate(700,220)" opacity="0.6">
    <rect x="-6" y="-40" width="12" height="8" fill="#FCD34D"/>
    <path d="M-14 -32 L14 -32 L18 -8 L-18 -8 Z" fill="#FCD34D" opacity="0.8"/>
    <rect x="-4" y="-6" width="8" height="4" fill="#FCD34D"/>
  </g>
  <!-- Arabic ornamental pattern -->
  <g transform="translate(60,280)" opacity="0.3">
    <path d="M0 0 L20 -10 L40 0 L60 -10 L80 0 L100 -10 L120 0" stroke="#FCD34D" stroke-width="1.5" fill="none"/>
  </g>
  <!-- Text -->
  <text x="60" y="100" font-family="'Inter',sans-serif" font-weight="800" font-size="14" fill="#FCD34D" letter-spacing="5">RAMADAN KAREEM</text>
  <text x="60" y="155" font-family="'Inter',sans-serif" font-weight="900" font-size="52" fill="#fff" letter-spacing="-2">Jusqu'à -30%</text>
  <text x="60" y="205" font-family="'Inter',sans-serif" font-weight="400" font-size="20" fill="#fff" opacity="0.9">Sur la sélection dattes, produits secs</text>
  <text x="60" y="228" font-family="'Inter',sans-serif" font-weight="400" font-size="20" fill="#fff" opacity="0.9">et essentiels du mois sacré.</text>
</svg>
